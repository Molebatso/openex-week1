name: CI — OpenEx 3.0 Backend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openex_test
          POSTGRES_USER: openex
          POSTGRES_PASSWORD: openex_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew
        if: hashFiles('backend/gradlew') != ''

      - name: Run tests
        working-directory: backend
        run: gradle test --no-daemon
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/openex_test
          SPRING_DATASOURCE_USERNAME: openex
          SPRING_DATASOURCE_PASSWORD: openex_secret
          JWT_SECRET: "ci-test-secret-key-minimum-512-bits-long-placeholder-value"
          JWT_EXPIRATION_MS: 3600000

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Tests
          path: backend/build/test-results/**/*.xml
          reporter: java-junit
