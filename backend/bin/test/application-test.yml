spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:openex_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: "test-secret-key-for-unit-tests-only-minimum-512-bits-long-padded-to-length"
  expiration-ms: 3600000
